name: RUNE v14 ARM64 Sparse Spectrum Qualification
on:
  push:
    branches: [research/rune-v14-arm-spectrum-20261020]
    paths:
      - 'runesort_v14/**'
      - 'experiments/v14-spectrum-benchmark.cpp'
      - 'experiments/v14_baselines/**'
      - '.github/workflows/v14-spectrum.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Record machine and toolchain
        run: |
          set -euo pipefail
          uname -a
          lscpu
          g++ --version
      - name: Full repository tests
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/rune-v14-test -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v14-test --parallel 2
          ctest --test-dir /tmp/rune-v14-test --output-on-failure
      - name: Compile pinned four-way comparison
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -DNDEBUG -pthread -I. experiments/v14-spectrum-benchmark.cpp -o /tmp/v14-spectrum-bench
      - name: Compare exact-output at three array sizes
        run: |
          set -euo pipefail
          mkdir -p v14-raw
          for n in 524288 1000000 4000000; do
            /tmp/v14-spectrum-bench "$n" | tee "v14-raw/$n.csv"
          done
      - name: Preserve raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-v14-native-${{ matrix.runner }}
          path: v14-raw/*.csv
          if-no-files-found: warn
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Sanitized spectrum, bounds and fail-closed tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Irunesort_v14 runesort_v14/test_spectrum.cpp -o /tmp/v14-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/v14-sanitized
      - name: x86 no-BMI2 portability
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -mno-bmi2 -Irunesort_v14 runesort_v14/test_spectrum.cpp -o /tmp/v14-portable
          /tmp/v14-portable
