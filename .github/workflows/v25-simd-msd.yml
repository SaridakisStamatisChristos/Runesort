name: RUNE v25 SIMD MSD Qualification
on:
  push:
    branches: [research/rune-v25-simd-msd-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record provenance
        run: |
          set -euo pipefail
          mkdir -p v25-results
          { uname -a; lscpu; g++ --version; git rev-parse HEAD; } | tee v25-results/provenance.txt
      - name: Verify complete CMake/CTest and differential
        run: |
          set -euo pipefail
          python3 experiments/v25-simd-msd/verify_inheritance.py
          cmake -S . -B /tmp/rune-v25 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v25 --parallel 2
          ctest --test-dir /tmp/rune-v25 --output-on-failure
          g++ -std=c++17 -O3 -march=native -DNDEBUG -I. runesort_v25/test_simd.cpp -o /tmp/v25-test
          /tmp/v25-test | tee -a v25-results/provenance.txt
      - name: Fetch immutable comparator sources
        run: |
          set -euo pipefail
          mkdir -p /tmp/rune25-ext
          cd /tmp/rune25-ext
          git init highway
          git -C highway remote add origin https://github.com/google/highway.git
          git -C highway fetch --depth=1 origin 3a5844a43b095751a4870ac0b66940d71ab60c38
          git -C highway checkout --detach FETCH_HEAD
          git init ips4o
          git -C ips4o remote add origin https://github.com/SaschaWitt/ips4o.git
          git -C ips4o fetch --depth=1 origin 8d5a97bb4c4048a1eef18b537f191a31462b051a
          git -C ips4o checkout --detach FETCH_HEAD
          test "$(git -C highway rev-parse HEAD)" = 3a5844a43b095751a4870ac0b66940d71ab60c38
          test "$(git -C ips4o rev-parse HEAD)" = 8d5a97bb4c4048a1eef18b537f191a31462b051a
      - name: Build native pinned Highway comparator
        run: |
          set -euo pipefail
          cmake -S /tmp/rune25-ext/highway -B /tmp/rune25-ext/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DHWY_ENABLE_TESTS=OFF -DHWY_ENABLE_EXAMPLES=OFF \
            -DHWY_ENABLE_INSTALL=OFF -DHWY_ENABLE_CONTRIB=ON
          cmake --build /tmp/rune25-ext/build --target hwy_contrib --parallel 2
      - name: Build exact same-array benchmark
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -march=native -DNDEBUG -pthread \
            -I. -I/tmp/rune25-ext/ips4o -I/tmp/rune25-ext/highway \
            experiments/v25-simd-msd-benchmark.cpp \
            /tmp/rune25-ext/build/libhwy_contrib.a \
            /tmp/rune25-ext/build/libhwy.a -latomic -o /tmp/v25-bench
      - name: Qualify four sizes and ten distributions with fresh seeds
        run: |
          set -euo pipefail
          mkdir -p v25-results
          /tmp/v25-bench 65536 | tee v25-results/64k.csv
          /tmp/v25-bench 999999 | tee v25-results/below_gate.csv
          /tmp/v25-bench 1000000 | tee v25-results/1m.csv
          /tmp/v25-bench 4000000 | tee v25-results/4m.csv
      - name: Validate full matrix and summarize paired seeds
        run: |
          set -euo pipefail
          python3 experiments/v25-simd-msd/summarize.py --isa "$(uname -m)" \
            --output v25-results/paired_summary.csv v25-results/64k.csv v25-results/below_gate.csv v25-results/1m.csv v25-results/4m.csv
          cat v25-results/paired_summary.csv
      - name: Retain raw outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v25-raw-${{ matrix.runner }}
          path: v25-results/
          if-no-files-found: warn
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check exact semantics under ASan and UBSan
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            -I. runesort_v25/test_simd.cpp -o /tmp/v25-san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 /tmp/v25-san
      - name: Compile forced scalar fallback
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -DRUNE25_DISABLE_SIMD -I. runesort_v25/test_simd.cpp -o /tmp/v25-no-prefetch
          /tmp/v25-no-prefetch
      - name: x86 baseline ISA and runtime feature dispatch verification
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -march=x86-64 -mno-avx512f -mno-bmi2 -I. runesort_v25/test_simd.cpp -o /tmp/v25-no-bmi2
          /tmp/v25-no-bmi2
