name: RUNE v22 Four-pass Radix16 Qualification
on:
  push:
    branches: [research/rune-v22-fourpass-radix16-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record CPU and compiler provenance
        run: |
          set -euo pipefail
          uname -a
          lscpu
          g++ --version
          git rev-parse HEAD
      - name: Verify all repository tests and v22 candidate exactness
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/rune-v22 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v22 --parallel 2
          ctest --test-dir /tmp/rune-v22 --output-on-failure
          g++ -std=c++17 -O3 -march=native -DNDEBUG -I. \
            runesort_v22/test_radix16.cpp -o /tmp/v22-test
          /tmp/v22-test
      - name: Fetch and verify pinned upstream algorithms
        run: |
          set -euo pipefail
          mkdir -p /tmp/rune22-ext
          cd /tmp/rune22-ext
          git init highway
          git -C highway remote add origin https://github.com/google/highway.git
          git -C highway fetch --depth=1 origin c3407ccaaecffa735c911cae3971efa02263211d
          git -C highway checkout --detach FETCH_HEAD
          git init ips4o
          git -C ips4o remote add origin https://github.com/SaschaWitt/ips4o.git
          git -C ips4o fetch --depth=1 origin 8d5a97bb4c4048a1eef18b537f191a31462b051a
          git -C ips4o checkout --detach FETCH_HEAD
          test "$(git -C highway rev-parse HEAD)" = c3407ccaaecffa735c911cae3971efa02263211d
          test "$(git -C ips4o rev-parse HEAD)" = 8d5a97bb4c4048a1eef18b537f191a31462b051a
      - name: Compile native Highway VQSort
        run: |
          set -euo pipefail
          cmake -S /tmp/rune22-ext/highway -B /tmp/rune22-ext/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DHWY_ENABLE_TESTS=OFF -DHWY_ENABLE_EXAMPLES=OFF \
            -DHWY_ENABLE_INSTALL=OFF -DHWY_ENABLE_CONTRIB=ON
          cmake --build /tmp/rune22-ext/build --target hwy_contrib --parallel 2
      - name: Build six-way comparator
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -march=native -DNDEBUG -pthread \
            -I. -I/tmp/rune22-ext/ips4o -I/tmp/rune22-ext/highway \
            experiments/v22-radix16-benchmark.cpp \
            /tmp/rune22-ext/build/libhwy_contrib.a \
            /tmp/rune22-ext/build/libhwy.a -latomic -o /tmp/v22-comp
      - name: Benchmark exact-output 1M and 4M arrays
        run: |
          set -euo pipefail
          mkdir -p v22-raw
          /tmp/v22-comp 1000000 | tee v22-raw/1m.csv
          /tmp/v22-comp 4000000 | tee v22-raw/4m.csv
      - name: Archive full raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-raw-${{ matrix.runner }}
          path: v22-raw/*.csv
          if-no-files-found: warn
  sanitized:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ASan/UBSan exactness
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -I. \
            runesort_v22/test_radix16.cpp -o /tmp/v22-san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 /tmp/v22-san
      - name: Portable x86 no-BMI2 build
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -mno-bmi2 -I. \
            runesort_v22/test_radix16.cpp -o /tmp/v22-portable
          /tmp/v22-portable
