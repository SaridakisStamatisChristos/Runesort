name: RUNE exact 131K table ablation
on:
  push:
    branches: [research/rune-v9-capacity-fallback-20261020]
    paths: ['experiments/v9-capacity-ablation.cpp', '.github/workflows/v9-capacity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record CPU
        run: |
          uname -m
          lscpu
          g++ --version
      - name: Install Boost
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libboost-dev
      - name: Compile standalone candidate
        run: g++ -O3 -march=native -DNDEBUG -std=c++17 -I. experiments/v9-capacity-ablation.cpp -o /tmp/rune-capacity
      - name: Benchmark and verify
        run: |
          set -euo pipefail
          mkdir -p experiment-results
          /tmp/rune-capacity 200000 3 | tee experiment-results/n200k.csv
          /tmp/rune-capacity 1000000 3 | tee experiment-results/n1m.csv
      - name: Save raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-capacity-${{ matrix.runner }}
          path: experiment-results/*.csv
          if-no-files-found: warn
