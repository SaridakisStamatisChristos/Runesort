name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRUNE_WITH_BOOST_BENCHMARK=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Differential and dispatch checks
        run: ctest --test-dir build --output-on-failure
