name: RUNE v18 Buffered Radix Research
on:
  push:
    branches: [research/rune-v18-buffered-radix-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Machine and compiler
        run: |
          uname -a
          lscpu
          g++ --version
      - name: Compile and test existing versions plus v18
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/rune-v18 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v18 --parallel 2
          ctest --test-dir /tmp/rune-v18 --output-on-failure
      - name: Five-seed randomized same-input worker comparison
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -DNDEBUG -I. \
            experiments/v18-buffered-benchmark.cpp -o /tmp/v18-bench
          mkdir -p v18-evidence
          /tmp/v18-bench 1000000 | tee v18-evidence/1m.csv
          /tmp/v18-bench 4000000 | tee v18-evidence/4m.csv
      - name: Archive raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v18-raw-${{ matrix.runner }}
          path: v18-evidence/*.csv
          if-no-files-found: warn
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ASan / UBSan
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -I. runesort_v18/test_buffered.cpp -o /tmp/v18-san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 /tmp/v18-san
      - name: Portable x86 without BMI2
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -mno-bmi2 -I. runesort_v18/test_buffered.cpp -o /tmp/v18-portable
          /tmp/v18-portable
