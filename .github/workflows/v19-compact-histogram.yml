name: RUNE v19 Compact Histogram Qualification
on:
  push:
    branches: [research/rune-v19-compact-histogram-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Hardware and toolchain
        run: |
          uname -a
          lscpu
          g++ --version
      - name: CMake, CTest and differential
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/rune-v19 -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v19 --parallel 2
          ctest --test-dir /tmp/rune-v19 --output-on-failure
      - name: Same-seed isolated radix histogram qualification
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -DNDEBUG -I. \
            experiments/v19-histogram-benchmark.cpp -o /tmp/v19-bench
          mkdir -p v19-results
          /tmp/v19-bench 1000000 | tee v19-results/1m.csv
          /tmp/v19-bench 4000000 | tee v19-results/4m.csv
      - name: Archive paired raw timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-raw-${{ matrix.runner }}
          path: v19-results/*.csv
          if-no-files-found: warn
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ASan and UBSan exact differential
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -I. \
            runesort_v19/test_compact_histogram.cpp -o /tmp/v19-san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            UBSAN_OPTIONS=halt_on_error=1 /tmp/v19-san
      - name: Portable no BMI2 x86 test
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -mno-bmi2 -I. runesort_v19/test_compact_histogram.cpp -o /tmp/v19-portable
          /tmp/v19-portable
