name: RUNE v11 Compacted Radix Scratch Qualification
on:
  push:
    branches:
      - research/rune-v11-compacted-scratch-20261020
    paths:
      - 'runesort_v11/**'
      - 'experiments/v11-scratch-benchmark.cpp'
      - '.github/workflows/v11-compacted-scratch.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Print exact runtime environment
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          g++ --version
          cmake --version
      - name: Build C++17 and execute repository correctness suite
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/rune-v11-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rune-v11-build --parallel 2
          ctest --test-dir /tmp/rune-v11-build --output-on-failure
      - name: Build frozen v7 / v10 / new v11 same-input benchmark
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -march=native -DNDEBUG -pthread -I. experiments/v11-scratch-benchmark.cpp -o /tmp/rune-v11-bench
      - name: Benchmark 1M and 4M keys with oracle and randomized ordering
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p experiment-results
          /tmp/rune-v11-bench 1000000 | tee experiment-results/1m.csv
          /tmp/rune-v11-bench 4000000 | tee experiment-results/4m.csv
      - name: Save raw measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rune-v11-native-${{ matrix.runner }}
          path: experiment-results/*.csv
          if-no-files-found: warn
  sanitizer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile compacted-bit tests under ASan/UBSan
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Irunesort_v11 runesort_v11/test_compacted.cpp -o /tmp/v11-compacted-sanitized
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/v11-compacted-sanitized
      - name: Portable x86 no-BMI2 correctness
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -mno-bmi2 -Irunesort_v11 runesort_v11/test_compacted.cpp -o /tmp/v11-compacted-portable
          /tmp/v11-compacted-portable
